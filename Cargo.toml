[package]
name = "timehud"
version = "1.0.1"
edition = "2024"
# let-chains need 1.88, but eframe/egui 0.37 require 1.95.
rust-version = "1.95"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "default_fonts"] }
nix = { version = "0.31.3", features = ["fs", "poll", "time", "user"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tiny-skia = "0.12.0"
x11rb = { version = "0.14.0", features = ["randr", "shape"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
