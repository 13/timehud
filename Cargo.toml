[package]
name = "timehud"
version = "0.9.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false }
fontdue = "0.9.5"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
