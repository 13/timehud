[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timehud"
dynamic = ["version"]
description = "Lightweight transparent HUD overlay for Linux — clock + stopwatch/countdown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyQt6>=6.11.0"]

[project.optional-dependencies]
hotkeys = ["pynput>=1.8.1"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.4"]

[project.scripts]
timehud = "timehud.main:main"

[tool.setuptools.dynamic]
version = { attr = "timehud.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
timehud = ["*.svg"]

[tool.ruff]
line-length = 100

# Pin the rule set explicitly. Without a `select`, every ruff release that
# widens its defaults turns a green checkout red without a code change; the
# existing `noqa: E402` / `noqa: N802` comments also only mean something while
# pycodestyle and pep8-naming are enabled.
[tool.ruff.lint]
# E4/E7/E9 + F are ruff's own defaults; I and N are added because the
# code carries `noqa: E402` and `noqa: N802` directives that rely on them.
select = ["E4", "E7", "E9", "F", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
