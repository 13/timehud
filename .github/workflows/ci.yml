name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # alsa-sys is the only crate linking a system library at build time;
        # X11/GL/xkbcommon are pure Rust or loaded via dlopen at runtime.
        # sudo may be missing on a self-hosted Gitea runner (already root).
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev fontconfig curl ca-certificates
      # Runs on GitHub and Gitea alike: the self-hosted Gitea runner has no Rust toolchain.
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal -c rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
