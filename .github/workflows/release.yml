name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Install system dependencies
        # alsa-sys is the only crate linking a system library at build time;
        # X11/GL/xkbcommon are pure Rust or loaded via dlopen at runtime.
        # sudo may be missing on a self-hosted Gitea runner (already root).
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev fontconfig curl ca-certificates jq
      # Runs on GitHub and Gitea alike: the self-hosted Gitea runner has no Rust toolchain.
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal -c rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          CRATE=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${VERSION}" != "v${CRATE}" ]; then
            echo "::error::tag ${VERSION} does not match Cargo.toml version ${CRATE} (expected v${CRATE})"
            exit 1
          fi
      - name: Gate (fmt, clippy, tests)
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build release binary
        run: cargo build --locked --release
      - name: Pack tarball
        run: |
          set -eux
          NAME="timehud-${VERSION}-x86_64"
          mkdir -p "dist/$NAME"
          cp target/release/timehud assets/icons/timehud.svg assets/timehud.desktop assets/OFL.txt assets/OFL-Roboto.txt README.md LICENSE "dist/$NAME/"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          echo "TARBALL=$NAME.tar.gz" >> "$GITHUB_ENV"
      - name: Upload artifact
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: timehud-x86_64
          path: ${{ env.TARBALL }}
      - name: Create GitHub Release
        if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          files: ${{ env.TARBALL }}
      - name: Create Gitea Release
        if: github.server_url != 'https://github.com' && startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          RELEASE_ID=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$VERSION" '{tag_name: $t, name: ("Release " + $t)}')" \
            | jq -r '.id')
          curl -fsS -X POST "$API/releases/$RELEASE_ID/assets?name=$TARBALL" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@$TARBALL"
